name: Publish Windows installer
on:
  push:
    branches: ['codex/windows-upload-*']
    paths: ['windows-upload/**']
permissions:
  contents: write
jobs:
  release:
    if: contains(github.event.head_commit.message, '[windows-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify and publish candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/scripts/publish_windows.py
